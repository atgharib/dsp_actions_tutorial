name: Hi there example

on:
  push:

jobs:
# first job
  hi-there-example:
    runs-on: ubuntu-latest
    steps:
    - name: cowsay_Install
      run: pip install cowsay
    - name: cowsayRun
      run: cowsay -c cheese -t 'hey there'

  # 2nd job 
  cowpy-example:
    runs-on: ubuntu-latest
    steps:
    - name: cowpyExample
      run: pip install cowpy
    - name: cowpyRun
      run: cowpy -c tux hi there
     


